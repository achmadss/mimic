services:
  mimic:
    build: .
    restart: unless-stopped
    init: true
    ports:
      # the dashboard, on this machine only
      - "127.0.0.1:8787:8787"
    volumes:
      # create .env before the first `up`: a missing file gets mounted as an empty directory
      - ./.env:/app/.env
      - ./characters:/app/characters
      - ./data:/app/data
