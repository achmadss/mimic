services:
  mimic:
    build: .
    restart: unless-stopped
    init: true
    ports:
      # the dashboard, on every interface: DASHBOARD_PASSWORD guards it
      - "8787:8787"
    # app settings only; keys, tokens and models are set in the dashboard and kept in data/
    env_file:
      - path: .env
        required: false
    # wins over .env: a DB_PATH left there from an older setup would put the database in the
    # container, where every rebuild wipes it
    environment:
      DB_PATH: data/mimic.db
      MIMIC_CONFIG: data/mimic.config.json
    volumes:
      - ./characters:/app/characters
      - ./data:/app/data
